services:
  web:
    container_name: ibns_smart_ops_web
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWORD:-odoo}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${DB_USER:-odoo}
      - PGPASSWORD=${DB_PASSWORD:-odoo}
    restart: unless-stopped

  db:
    container_name: ibns_smart_ops_db
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME:-odoo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-odoo}
      - POSTGRES_USER=${DB_USER:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
