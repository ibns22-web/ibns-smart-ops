services:
  web:
    container_name: ibns_smart_ops_web
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWORD:-odoo}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${DB_USER:-odoo}
      - PGPASSWORD=${DB_PASSWORD:-odoo}
      - DB_NAME=${DB_NAME:-odoo}
      - PGDATABASE=${DB_NAME:-odoo}
      - SFA_API_SECRET_KEY=${SFA_API_SECRET_KEY:-}
    restart: unless-stopped

  db:
    container_name: ibns_smart_ops_db
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME:-odoo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-odoo}
      - POSTGRES_USER=${DB_USER:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d ${DB_NAME:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
